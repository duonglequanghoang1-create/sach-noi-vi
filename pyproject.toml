[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sach-noi-vi"
version = "0.1.0"
description = "Pipeline tao sach noi tieng Viet: trich xuat -> dich -> TTS (VieNeu-TTS) -> M4B"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
extract = ["pymupdf>=1.24", "ebooklib>=0.18", "beautifulsoup4>=4.12"]
tts = ["torch>=2.2", "soundfile>=0.12", "numpy>=1.26"]

[project.scripts]
sach-noi = "sachnoi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sachnoi = ["py.typed"]