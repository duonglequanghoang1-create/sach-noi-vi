name: rights-gate

# The repository must never contain prose from a work that is still under
# copyright. This runs on every push and blocks the change if any committed
# book.json declares a licence outside the allow-list, or ships text for a
# book whose licence is not allowed.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check every committed book is public domain
        run: |
          chmod +x tools/check_rights.py
          python3 tools/check_rights.py --json | tee rights-report.json

      - name: Fail if anything is wrong
        if: ${{ failure() }}
        run: |
          echo "::error::A book in this repository is not public domain."
          echo "Remove the book, or fix books/<slug>/book.json to declare a"
          echo "licence from: public-domain, CC0, CC-BY-4.0, CC-BY-SA-4.0"
          exit 1